<div class="app-layout" [class.sidebar-collapsed]="!sidebarOpen()">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-icon">INSBAPA</div>
      <span class="brand-sub">LMS</span>
    </div>

    <nav class="sidebar-nav">
      @for (item of getNavItems(); track item.route) {
        <a class="nav-item" [routerLink]="item.route" routerLinkActive="active">
          <span class="nav-icon" [innerHTML]="getIcon(item.icon)"></span>
          <span class="nav-label">{{ item.label }}</span>
        </a>
      }
    </nav>

    <div class="sidebar-user">
      <div class="user-avatar">{{ authService.usuario()?.iniciales }}</div>
      <div class="user-info">
        <div class="user-name">{{ authService.usuario()?.primerNombre }} {{ authService.usuario()?.primerApellido }}</div>
        <div class="user-role">{{ authService.usuario()?.rol }}</div>
      </div>
      <button class="btn-logout" (click)="logout()" title="Cerrar sesión">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
      </button>
    </div>
  </aside>

  <div class="main-area">
    <header class="topbar">
      <button class="toggle-btn" (click)="toggleSidebar()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
      <div class="topbar-date">{{ today }}</div>
    </header>

    <main class="content">
      <router-outlet />
    </main>
  </div>
</div>
